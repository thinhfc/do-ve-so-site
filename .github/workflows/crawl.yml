name: Crawl results

on:
  schedule:
    # Draws: South 16:15, Central 17:15, North 18:15 (UTC+7) → every 10 min 09:00–12:59 UTC, plus a backfill every 3 hours.
    - cron: "*/10 9-12 * * *"
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python crawler/crawl.py .
      - name: Commit changes
        run: |
          git config user.name "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api
          git diff --cached --quiet && exit 0
          git commit -m "data: results $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
